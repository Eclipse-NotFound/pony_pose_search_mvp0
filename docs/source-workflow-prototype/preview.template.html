    n.queue=[...ids]; n.done=0;n.batchTotal=ids.length;n.running=ids.length>0;
    record(ids.length?`登记 ${ids.length} 个示例文件，开始模拟处理；原文件保留在原位置。`:'重复导入：文件身份已存在，跳过全部重复项。');break;
   }
   case 'TICK': if(n.running&&n.queue.length){const [id,...rest]=n.queue;n.catalog[id]=id==='mov'?'error':'ready';n.queue=rest;n.done++;if(!rest.length){n.running=false;record(Object.values(n.catalog).includes('error')?'本批处理结束：1 个 MOV 的预览任务模拟中断，其余文件已分别编目。':'本批处理结束：所选文件已分别编目。')}}break;
   case 'PAUSE': n.running=false;record('已暂停。入库记录和已完成的结果仍然保留。');break;
   case 'RESUME': n.running=n.queue.length>0;record('继续处理剩余文件。');break;
   case 'RETRY': if(n.catalog[a.id]==='error'){n.catalog[a.id]='ready';record('模拟重试成功：MOV 预览恢复，未重复登记文件。')}break;
   case 'INDEX': n.indexed=Object.keys(n.catalog).filter(id=>n.catalog[id]==='ready'&&a.searchable.includes(id));record(`已为 ${n.indexed.length} 个文件载入演示姿态，可开始搜索；没有调用识别模型。`);break;
   case 'QUERY': n.query=a.value;n.searched=false;break;
   case 'FLIP': n.flip=a.value;break;
   case 'SWAP': n.swap=a.value;break;
   case 'SEARCH': n.searched=true;n.page='search';record('完成演示搜索。评分只用于展示结果流程，不代表模型准确率。');break;
   case 'MISSING': n.missing=true;record('模拟素材根目录离线：缓存画面可看，原文件入口不可用。');break;
   case 'REBIND': n.root=a.path;n.missing=false;record('演示根目录映射已更新；未检查或移动磁盘文件。');break;
  }
  return n;
 }
 const specs = {
  discord:[['discord',26,96,false],['discord',53,89,false],['discord',80,83,false],['discord',0,94,true]],
  spike:[['spike',114,95,false]],
  twilight:[['twilight',0,96,false]],
  all:[['discord',26,92,false],['tirek',31,79,false],['spike',114,73,false],['twilight',0,70,false],['jpg',null,61,false],['discord',0,94,true]]
 };
 function results(s,filter={}){
  return specs[s.query].filter(([id,, ,mirror])=>s.indexed.includes(id)&&(!mirror||s.flip))
   .map(([id,n,score,mirror])=>({id,n,score:score-(!s.swap&&id==='discord'?3:0),mirror}))
   .filter(r=>(!filter.available||!s.missing)&&(!filter.exact||r.n!==null)&&(!filter.format||filter.format===(r.id==='jpg'?'JPG':'MP4'))&&(!filter.related||r.id!=='jpg'))

 }

})();
